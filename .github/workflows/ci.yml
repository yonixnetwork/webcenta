name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    name: Schema & smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webcenter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: webcenter_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webcenter"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://webcenter:ci-only-password@localhost:5432/webcenter_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npx prisma db push
      - run: npm run db:smoke
